# ============================================================
# CAMPAIGN DATA QUALITY FRAMEWORK
# CONFIGURATION - metadata-driven, multi-catalog
#
# WHAT CHANGED FROM THE PREVIOUS VERSION:
#   - table_rules: removed entirely. No table/column names or
#     table-specific rules live here anymore. Every table now
#     gets its rules 100% from auto_rules.build_auto_rule()'s
#     live schema inspection (mandatory columns, key candidates,
#     range rules, pattern rules - all derived from the actual
#     data, not hand-written here).
#   - relationships: removed entirely, for the same reason - it
#     named specific tables/columns. See "Known limitation" below.
#   - framework.catalog -> split into two concepts:
#       control_catalog: where the framework's OWN output lives
#         (dqx_bronze/silver/gold/audit/quarantine/profiling) -
#         this is infrastructure, not source data, so it's fine
#         for it to be one configured location.
#       included_catalogs / excluded_catalogs: which catalogs to
#         DISCOVER AND SCAN as source data. Leave included_catalogs
#         empty to scan every catalog Unity Catalog exposes, minus
#         excluded_catalogs.
#
# KNOWN LIMITATION (read before relying on this in production):
# Removing table_rules means DQ04/DQ08 no longer benefit from the
# hand-picked pattern_rules and allowed_values that only a human
# who knows the business could write (e.g. "record_id must match
# ^CAMP_[0-9]{4}$", "risk_level must be one of LOW/MEDIUM/HIGH").
# auto_rules.py's schema-derived rules will still cover
# completeness/uniqueness/basic ranges/data types automatically,
# but validation gets measurably looser for anything that depends
# on business-specific format or vocabulary. This is the direct
# tradeoff of "fully metadata-driven" - it's not a bug, but you
# should know DQ03/DQ08/DQ14/DQ15 will catch less on tables that
# used to have manual rules.
#
# Similarly, removing relationships: means DQ06 (Integrity,
# cross-table) has no configured foreign-key pairs to check
# unless auto_rules.py can discover real FK constraints declared
# natively in Unity Catalog (information_schema.key_column_usage /
# referential_constraints) - I can't confirm whether it does this
# without seeing auto_rules.py's source. If it doesn't, DQ06 will
# effectively no-op across all tables until that's added.
# ============================================================

framework:
  name: Campaign Data Quality Framework

  # Where the framework's OWN tables live (Bronze/Silver/Gold/
  # audit/quarantine/profiling). This is infrastructure, not
  # source data - one location for it is intentional, not a
  # violation of "don't hardcode source tables".
  control_catalog: wmg

  # Which catalogs to DISCOVER AND SCAN as source data.
  # Leave empty ([]) to scan every catalog Unity Catalog exposes
  # (minus excluded_catalogs). Set explicit names here only if you
  # want to restrict discovery to specific catalogs.
  included_catalogs: []

  # System/infrastructure catalogs that should never be treated as
  # source data, regardless of included_catalogs.
  excluded_catalogs:
    - system
    - samples
    - hive_metastore

  # information_schema is a schema WITHIN every catalog, not a
  # catalog itself - excluded here, applied inside every catalog
  # during schema discovery.
  excluded_schemas:
    - information_schema
    - dqx_bronze
    - dqx_silver
    - dqx_gold
    - dqx_audit
    - dqx_quarantine
    - dqx_profiling

  bronze_schema: dqx_bronze
  silver_schema: dqx_silver
  gold_schema: dqx_gold
  audit_schema: dqx_audit
  quarantine_schema: dqx_quarantine
  candidate_schema: dqx_profiling

  # Optional: restrict discovery to specific schema names WITHIN
  # every scanned catalog. Leave empty to scan every non-excluded
  # schema in every catalog. Currently scoped to 'demo' to match
  # your existing environment - widen or empty this out once
  # you're ready to discover beyond it.
  source_schema_allowlist:
    - demo

  default_freshness_hours: 24
  volume_default_variance_pct: 30


overall_thresholds:
  pass: 90
  warning: 75
  fail: 0


quality_gate:
  enabled: true
  silver_min_score: 90


# ============================================================
# DQ RULES - generic dimension definitions only.
# No table names, no column names, no table-specific logic.
# Total default weight = 100.
# ============================================================

dq_rules:

  - id: DQ01
    dimension: completeness
    level: column
    enabled: true
    default_weight: 10
    severity: high

  - id: DQ02
    dimension: accuracy
    level: row
    enabled: true
    default_weight: 10
    severity: high

  - id: DQ03
    dimension: validity
    level: column
    enabled: true
    default_weight: 8
    severity: high

  - id: DQ04
    dimension: uniqueness
    level: dataset
    enabled: true
    default_weight: 8
    severity: critical

  - id: DQ05
    dimension: consistency
    level: row
    enabled: true
    default_weight: 7
    severity: medium

  - id: DQ06
    dimension: integrity
    level: cross_table
    enabled: true
    default_weight: 7
    severity: critical

  - id: DQ07
    dimension: timeliness
    level: dataset
    enabled: true
    default_weight: 6
    severity: high

  - id: DQ08
    dimension: conformity
    level: column
    enabled: true
    default_weight: 5
    severity: medium

  - id: DQ09
    dimension: range
    level: row
    enabled: true
    default_weight: 5
    severity: high

  - id: DQ10
    dimension: duplicate
    level: dataset
    enabled: true
    default_weight: 7
    severity: high

  - id: DQ11
    dimension: "null"
    level: column
    enabled: true
    default_weight: 8
    severity: high

  - id: DQ12
    dimension: length
    level: column
    enabled: true
    default_weight: 4
    severity: medium

  - id: DQ13
    dimension: data_type
    level: column
    enabled: true
    default_weight: 5
    severity: high

  - id: DQ14
    dimension: pattern
    level: column
    enabled: true
    default_weight: 4
    severity: medium

  - id: DQ15
    dimension: business_rule
    level: row
    enabled: true
    default_weight: 5
    severity: critical

  - id: DQ16
    dimension: volume
    level: dataset
    enabled: true
    default_weight: 1
    severity: medium


# ============================================================
# table_rules intentionally removed.
# Every table's rules now come 100% from auto_rules.build_auto_rule()
# inspecting the table's live schema at run time. If you need to
# hand-tune a specific table again later, this is where a manual
# override block would go back in - but per this request, none
# are hardcoded here anymore.
# ============================================================

table_rules: {}


# ============================================================
# relationships intentionally removed - see "Known limitation"
# in the header comment above.
# ============================================================

relationships: []


profiling:
  enabled: true
  top_values: 10
  candidate_null_rate_pct: 1


# ============================================================
# KPI METRICS
# label_kpi_map is NOT table/column hardcoding - it's a business
# taxonomy (incident label -> DQ dimension), inherent to
# Requirement 02 and independent of any specific catalog/schema/
# table. This has to stay hand-defined; there's no metadata to
# auto-discover an incident's business meaning from.
# ============================================================

kpi_metrics:

  enabled: true

  # Framework-owned tables. Given as schema + table name only -
  # kpi_metrics.py builds the full path by prefixing
  # framework.control_catalog at runtime, so the catalog literal
  # exists in exactly ONE place (framework.control_catalog above),
  # not repeated in every table reference.
  incident_log_schema: dqx_audit
  incident_log_table_name: dq_incident_log
  incident_report_schema: dqx_audit
  incident_report_table_name: dq_kpi_incident_report

  severity_weights:
    duration_weight: 0.5
    revenue_weight: 0.5

  label_kpi_map:
    "Null Primary Keys":
      kpi: DQ01
      kpi_name: Completeness
      dimension: completeness

    "Data Quality Breach":
      kpi: DQ01
      kpi_name: Completeness
      dimension: completeness

    "FK Mismatch":
      kpi: DQ06
      kpi_name: Integrity
      dimension: integrity

    "Duplicate Check Failure":
      kpi: DQ10
      kpi_name: Duplicate
      dimension: duplicate

    "Format/Regex Failure":
      kpi: DQ03
      kpi_name: Validity
      dimension: validity

    "Type Conversion Error":
      kpi: DQ13
      kpi_name: Data Type
      dimension: data_type

    "Code Failure / Schema Shift":
      kpi: OPS01
      kpi_name: Availability
      dimension: availability

    "Network / Timeout":
      kpi: OPS01
      kpi_name: Availability
      dimension: availability

    "Resource Contention":
      kpi: DQ07
      kpi_name: Timeliness
      dimension: timeliness

    "SLA Latency Breach":
      kpi: DQ07
      kpi_name: Timeliness
      dimension: timeliness

  default_kpi:
    kpi: OPS99
    kpi_name: Unclassified
    dimension: unclassified


ml_weighting:
  enabled: true
  # incident_history lives in a SOURCE schema (part of
  # source_schema_allowlist) rather than an audit schema,
  # deliberately - this is what lets it be discovered and
  # DQ-checked by the normal per-table loop like any other table.
  incident_schema: demo
  incident_table_name: incident_history
  feature_columns:
    - incident_count
    - avg_mttd_minutes
    - avg_mtta_minutes
    - avg_mttr_minutes
    - aidr_pct
    - severity_score
  target_column: total_rev_impact
  output_schema: dqx_audit
  output_table_name: dq_dynamic_weights
  min_training_rows: 10


output_tables:
  audit: dq_audit_results
  summary: dq_summary
  quarantine: dq_quarantine
  profiling: dq_profile
  candidates: dq_rule_candidates
  kpi: dq_kpis
  weights: dq_dynamic_weights
  pipeline_runs: dq_pipeline_runs