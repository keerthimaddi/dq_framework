# ============================================================
# CAMPAIGN DATA QUALITY FRAMEWORK
# CONFIGURATION
# ============================================================

framework:
  name: Campaign Data Quality Framework
  catalog: wmg

  excluded_schemas:
    - information_schema
    - dqx_bronze
    - dqx_silver
    - dqx_gold
    - dqx_audit
    - dqx_quarantine
    - dqx_profiling

  bronze_schema: dqx_bronze
  silver_schema: dqx_silver
  gold_schema: dqx_gold
  audit_schema: dqx_audit
  quarantine_schema: dqx_quarantine
  candidate_schema: dqx_profiling

  source_schema_allowlist:
    - demo

  default_freshness_hours: 24
  volume_default_variance_pct: 30


# ============================================================
# OVERALL SCORE THRESHOLDS
# ============================================================

overall_thresholds:
  pass: 90
  warning: 75
  fail: 0


# ============================================================
# QUALITY GATE
# ============================================================

quality_gate:
  enabled: true
  silver_min_score: 90


# ============================================================
# DQ RULES
# Total default weight = 100
# ============================================================

dq_rules:

  - id: DQ01
    dimension: completeness
    level: column
    enabled: true
    default_weight: 10
    severity: high

  - id: DQ02
    dimension: accuracy
    level: row
    enabled: true
    default_weight: 10
    severity: high

  - id: DQ03
    dimension: validity
    level: column
    enabled: true
    default_weight: 8
    severity: high

  - id: DQ04
    dimension: uniqueness
    level: dataset
    enabled: true
    default_weight: 8
    severity: critical

  - id: DQ05
    dimension: consistency
    level: row
    enabled: true
    default_weight: 7
    severity: medium

  - id: DQ06
    dimension: integrity
    level: cross_table
    enabled: true
    default_weight: 7
    severity: critical

  - id: DQ07
    dimension: timeliness
    level: dataset
    enabled: true
    default_weight: 6
    severity: high

  - id: DQ08
    dimension: conformity
    level: column
    enabled: true
    default_weight: 5
    severity: medium

  - id: DQ09
    dimension: range
    level: row
    enabled: true
    default_weight: 5
    severity: high

  - id: DQ10
    dimension: duplicate
    level: dataset
    enabled: true
    default_weight: 7
    severity: high

  - id: DQ11
    dimension: "null"
    level: column
    enabled: true
    default_weight: 8
    severity: high

  - id: DQ12
    dimension: length
    level: column
    enabled: true
    default_weight: 4
    severity: medium

  - id: DQ13
    dimension: data_type
    level: column
    enabled: true
    default_weight: 5
    severity: high

  - id: DQ14
    dimension: pattern
    level: column
    enabled: true
    default_weight: 4
    severity: medium

  - id: DQ15
    dimension: business_rule
    level: row
    enabled: true
    default_weight: 5
    severity: critical

  - id: DQ16
    dimension: volume
    level: dataset
    enabled: true
    default_weight: 1
    severity: medium


# ============================================================
# TABLE RULES
# ============================================================

table_rules:

  # ----------------------------------------------------------
  # CAMPAIGN DATA
  # ----------------------------------------------------------

  wmg.demo.campaign_data:

    unique_keys:
      - record_id

    mandatory_columns:
      - record_id
      - campaign_name
      - ad_set_name
      - amount_spent_usd
      - age_group
      - creative_type
      - event_date
      - incident

    null_columns:
      - record_id
      - campaign_name
      - ad_set_name
      - amount_spent_usd
      - age_group
      - creative_type
      - event_date
      - incident

    expected_types:
      record_id: string
      campaign_id: string
      campaign_name: string
      ad_set_name: string
      amount_spent_usd: double
      age_group: string
      creative_type: string
      event_date: date
      incident: string
      rev_impact: double
      ds: string
      label_code: string
      kpi: string
      include_count: int

    allowed_values:

      age_group:
        - 18-24
        - 25-34
        - 35-44
        - 45-54
        - 55+

      creative_type:
        - Video
        - Display
        - Carousel
        - Static
        - HTML5

      ds:
        - DV360
        - Meta
        - Google
        - TTD

      include_count:
        - 0
        - 1

    range_rules:

      amount_spent_usd:
        min: 0

      rev_impact:
        min: 0

      include_count:
        min: 0
        max: 1

    length_rules:

      campaign_name:
        min: 3
        max: 120

      ad_set_name:
        min: 3
        max: 120

      incident:
        max: 200

    pattern_rules:

      record_id: '^CAMP_[0-9]{4}$'
      campaign_id: '^CMP_[0-9]{3}$'
      label_code: '^L[0-9]{2}$'

    conformity_rules:

      amount_spent_usd: 'amount_spent_usd >= 0'
      rev_impact: 'rev_impact >= 0'

    row_expressions:

      spend_non_negative: 'amount_spent_usd >= 0'
      impact_non_negative: 'rev_impact >= 0'

    consistency_rules:

      include_is_binary: 'include_count IN (0,1)'

    business_rules:

      include_incident_logic: '((include_count = 1) OR (include_count = 0))'

    date_columns:
      - event_date


  # ----------------------------------------------------------
  # CAMPAIGN MASTER
  # ----------------------------------------------------------

  wmg.demo.campaign_master:

    unique_keys:
      - campaign_id

    mandatory_columns:
      - campaign_id
      - campaign_name

    null_columns:
      - campaign_id
      - campaign_name

    expected_types:
      campaign_id: string
      campaign_name: string

    pattern_rules:
      campaign_id: '^CMP_[0-9]{3}$'

    length_rules:
      campaign_name:
        min: 3
        max: 120

    allowed_values: {}
    range_rules: {}
    conformity_rules: {}
    row_expressions: {}
    consistency_rules: {}
    business_rules: {}
    date_columns: []


  # ----------------------------------------------------------
  # INCIDENT HISTORY
  # ----------------------------------------------------------

  wmg.demo.incident_history:

    unique_keys: []

    mandatory_columns:
      - incident_count
      - avg_mttd_minutes
      - avg_mtta_minutes
      - avg_mttr_minutes
      - aidr_pct
      - severity_score
      - total_rev_impact

    null_columns:
      - incident_count
      - avg_mttd_minutes
      - avg_mtta_minutes
      - avg_mttr_minutes
      - aidr_pct
      - severity_score
      - total_rev_impact

    expected_types:
      incident_count: int
      avg_mttd_minutes: double
      avg_mtta_minutes: double
      avg_mttr_minutes: double
      aidr_pct: double
      severity_score: double
      total_rev_impact: double

    allowed_values: {}
    range_rules: {}
    pattern_rules: {}
    length_rules: {}
    conformity_rules: {}
    row_expressions: {}
    consistency_rules: {}
    business_rules: {}
    date_columns: []


  # ----------------------------------------------------------
  # TRANSACTIONS
  # ----------------------------------------------------------

  wmg.demo.transactions:

    unique_keys:
      - transaction_id

    mandatory_columns:
      - transaction_id
      - customer_id
      - transaction_date
      - amount
      - transaction_type
      - currency
      - transaction_status
      - order_id
      - region
      - risk_level

    null_columns:
      - transaction_id
      - customer_id
      - transaction_date
      - amount
      - transaction_type
      - currency
      - transaction_status
      - order_id

    expected_types:
      transaction_id: string
      customer_id: string
      transaction_date: string
      amount: double
      transaction_type: string
      currency: string
      source: string
      channel: string
      transaction_status: string
      order_id: string
      region: string
      risk_level: string

    allowed_values:

      transaction_status:
        - SUCCESS
        - FAILED
        - PENDING
        - CANCELLED

      risk_level:
        - LOW
        - MEDIUM
        - HIGH

    range_rules:

      amount:
        min: 0

    length_rules:

      transaction_id:
        min: 1
        max: 100

      customer_id:
        min: 1
        max: 100

      order_id:
        min: 1
        max: 100

    pattern_rules: {}

    conformity_rules:

      amount_non_negative: "amount >= 0"

    row_expressions:

      amount_non_negative: "amount >= 0"

    consistency_rules: {}
    business_rules: {}

    date_columns:
      - transaction_date


  # ----------------------------------------------------------
  # EMEA / GLOBAL DATA
  # ----------------------------------------------------------

  wmg.demo.emea_and_global_data_combined_2_1:

    unique_keys: []

    mandatory_columns:
      - Campaign name
      - Ad set name
      - Ad name
      - Day
      - Delivery status
      - Delivery level
      - Amount spent (USD)
      - Impressions
      - Platform
      - Region
      - Market

    null_columns:
      - Campaign name
      - Ad set name
      - Ad name
      - Day
      - Amount spent (USD)
      - Impressions
      - Platform
      - Region
      - Market

    expected_types:

      Campaign name: string
      Ad set name: string
      Ad name: string
      Day: date
      Delivery status: string
      Delivery level: string
      Attribution setting: string
      Result type: string
      Results: bigint
      Reach: bigint
      Frequency: double
      Cost per result: double
      Amount spent (USD): double
      Quality ranking: string
      Engagement rate ranking: string
      Conversion rate ranking: string
      Impressions: bigint
      CPM: double
      Link clicks: bigint
      Shop clicks: bigint
      CPC: double
      CTR: double
      Landing page views: bigint
      Cost per landing page view: double
      Post engagements: bigint
      Cost per Page engagement: double
      Campaign Budget: double
      Campaign Budget Type: string
      Ad Set Budget: string
      Ad Set Budget Type: string
      Post reactions: bigint
      Post shares: bigint
      Post comments: bigint
      Post saves: bigint
      Cost per post engagement: double
      ThruPlays: bigint
      Platform: string
      Region: string
      Market: string
      Artist: string
      ACID: string
      Audience Type: string
      Optimization: string
      Age Group: string
      Placement: string
      Campaign: string
      Creative_Type: string

    allowed_values: {}

    range_rules:

      Results:
        min: 0

      Reach:
        min: 0

      Frequency:
        min: 0

      Amount spent (USD):
        min: 0

      Impressions:
        min: 0

      Link clicks:
        min: 0

      Shop clicks:
        min: 0

      CTR:
        min: 0

      Post engagements:
        min: 0

      Post reactions:
        min: 0

      Post shares:
        min: 0

      Post comments:
        min: 0

      Post saves:
        min: 0

      ThruPlays:
        min: 0

    length_rules:

      Campaign name:
        min: 1
        max: 500

      Ad set name:
        min: 1
        max: 500

      Ad name:
        min: 1
        max: 500

    pattern_rules: {}

    conformity_rules:

      spend_non_negative: "`Amount spent (USD)` >= 0"

    row_expressions:

      spend_non_negative: "`Amount spent (USD)` >= 0"

    consistency_rules: {}
    business_rules: {}

    date_columns:
      - Day


# ============================================================
# TABLE RELATIONSHIPS
# ============================================================

relationships:

  - name: campaign_master_fk
    child_table: wmg.demo.campaign_data
    child_column: campaign_id
    parent_table: wmg.demo.campaign_master
    parent_column: campaign_id
    nullable_allowed: false


# ============================================================
# PROFILING
# ============================================================

profiling:

  enabled: true
  top_values: 10
  candidate_null_rate_pct: 1


# ============================================================
# KPI METRICS
# ============================================================

kpi_metrics:

  enabled: true

  incident_log_table: wmg.dqx_audit.dq_incident_log

  incident_report_table: wmg.dqx_audit.dq_kpi_incident_report

  severity_weights:

    duration_weight: 0.5
    revenue_weight: 0.5

  label_kpi_map:

    "Null Primary Keys":
      kpi: DQ01
      kpi_name: Completeness
      dimension: completeness

    "Data Quality Breach":
      kpi: DQ01
      kpi_name: Completeness
      dimension: completeness

    "FK Mismatch":
      kpi: DQ06
      kpi_name: Integrity
      dimension: integrity

    "Duplicate Check Failure":
      kpi: DQ10
      kpi_name: Duplicate
      dimension: duplicate

    "Format/Regex Failure":
      kpi: DQ03
      kpi_name: Validity
      dimension: validity

    "Type Conversion Error":
      kpi: DQ13
      kpi_name: Data Type
      dimension: data_type

    "Code Failure / Schema Shift":
      kpi: OPS01
      kpi_name: Availability
      dimension: availability

    "Network / Timeout":
      kpi: OPS01
      kpi_name: Availability
      dimension: availability

    "Resource Contention":
      kpi: DQ07
      kpi_name: Timeliness
      dimension: timeliness

    "SLA Latency Breach":
      kpi: DQ07
      kpi_name: Timeliness
      dimension: timeliness

  default_kpi:

    kpi: OPS99
    kpi_name: Unclassified
    dimension: unclassified


# ============================================================
# ML DYNAMIC WEIGHTING
# ============================================================

ml_weighting:

  enabled: true

  incident_table: wmg.demo.incident_history

  feature_columns:

    - incident_count
    - avg_mttd_minutes
    - avg_mtta_minutes
    - avg_mttr_minutes
    - aidr_pct
    - severity_score

  target_column: total_rev_impact

  output_table: wmg.dqx_audit.dq_dynamic_weights

  min_training_rows: 10


# ============================================================
# OUTPUT TABLES
# ============================================================

output_tables:

  audit: dq_audit_results
  summary: dq_summary
  quarantine: dq_quarantine
  profiling: dq_profile
  candidates: dq_rule_candidates
  kpi: dq_kpis
  weights: dq_dynamic_weights
  pipeline_runs: dq_pipeline_runs